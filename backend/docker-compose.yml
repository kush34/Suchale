services:
  backend:
    build:
      context: .
      dockerfile: dockerfile
    container_name: social-backend
    restart: unless-stopped

    ports:
      - "${PORT}:${PORT}"

    env_file:
      - .env

    environment:
      PORT: ${PORT}
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/social?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # ponytail: container must serve — a local .env with NODE_ENV=test
      # (for jest) would skip listen and point at a localhost DB here
      NODE_ENV: production

    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:'+(process.env.PORT||3000)+'/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  mongodb:
    image: mongo:8
    container_name: mongodb
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}

    volumes:
      - mongodb_data:/data/db

    healthcheck:
      test: ["CMD-SHELL", "mongosh -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --quiet --eval \"db.adminCommand('ping')\""]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped

    # ponytail: healthcheck auths with $REDIS_PASSWORD, so it must exist
    # inside the container too — without this redis is unhealthy forever
    # and backend (depends_on healthy) never starts
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

volumes:
  mongodb_data:
  redis_data:
